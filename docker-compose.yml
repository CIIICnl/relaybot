services:
  app:
    build: .
    container_name: ciiic-automator
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    volumes:
      - drafts_data:/data
    networks:
      - slidecreator_default

volumes:
  drafts_data:

networks:
  slidecreator_default:
    external: true
